name: Playwright Tests (Week 11)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        working-directory: week-11-pw-automation
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: week-11-pw-automation
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: week-11-pw-automation
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: week-11-pw-automation/playwright-report/
          retention-days: 30
